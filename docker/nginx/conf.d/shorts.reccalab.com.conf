# ==============================================================================
# AutoShorts Ingress Configuration for shorts.reccalab.com
# Reverse Proxy to Uvicorn/FastAPI with Zero Open Raw Ports
# ==============================================================================

# HTTP Server: Port 80 (Let's Encrypt ACME Challenge + 301 Redirect to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name shorts.reccalab.com;

    # Let's Encrypt ACME challenge webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests permanently to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server: Port 443 (SSL Termination & Secure Reverse Proxy)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shorts.reccalab.com;

    # SSL Certificates (Managed via Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/shorts.reccalab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shorts.reccalab.com/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Hardened Security Response Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client upload limits (TikTok portrait MP4 videos)
    client_max_body_size 250M;

    # Real-time Server-Sent Events (SSE) Live Telemetry Stream
    location /api/events/stream {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        # Disable buffering and chunking for real-time SSE streaming
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static Assets Caching
    location /static/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Application Gateway (Reverse Proxy to FastAPI)
    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for longer AI generations or uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
