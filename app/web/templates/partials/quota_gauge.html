<div class="flex items-center space-x-6 text-sm">
    <!-- Worker Pulse -->
    <div class="flex items-center space-x-2">
        <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </span>
        <span class="text-xs text-slate-300 font-medium">Workers Active</span>
    </div>

    <!-- YouTube Data API Quota Bar -->
    <div class="flex items-center space-x-3 bg-slate-950/60 px-3 py-1.5 rounded-lg border border-slate-800">
        <span class="text-xs text-slate-400">YouTube Quota:</span>
        <div class="w-24 bg-slate-800 rounded-full h-2 overflow-hidden">
            {% set quota_percent = (quota_used / 10000.0) * 100 %}
            <div class="h-2 rounded-full {% if quota_used > 8400 %}bg-rose-500{% elif quota_used > 5000 %}bg-amber-400{% else %}bg-indigo-500{% endif %}"
                 style="width: {{ [quota_percent, 100]|min }}%"></div>
        </div>
        <span class="text-xs font-semibold {% if quota_used > 8400 %}text-rose-400{% elif quota_used > 5000 %}text-amber-400{% else %}text-slate-200{% endif %}">
            {{ quota_used }} / 10,000
        </span>
    </div>
</div>
